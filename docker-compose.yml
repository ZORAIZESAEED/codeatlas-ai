services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////codeatlas/data/codeatlas.db
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - api_data:/codeatlas/data
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
volumes:
  api_data:
